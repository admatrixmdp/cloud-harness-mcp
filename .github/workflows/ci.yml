name: CI

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: bash -n worker/clone-helper.sh worker/task-runner.sh worker/shell-runner.sh worker/worker-runner.sh worker/gh-helper.sh deploy/scripts/bootstrap-vps.sh deploy/scripts/deploy-release.sh deploy/scripts/release-runtime.sh deploy/scripts/rollback-release.sh deploy/scripts/deploy-ssh-wrapper.sh deploy/scripts/upgrade-nginx-dashboard.sh
      - run: npm run verify:compose
      - run: npm run verify
      - name: Verify documentation and reference integrity
        run: |
          npm run docs:reference
          npm run docs:check
          npm run docs:build
          npm run docs:artifact
  docker-integration:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - run: node scripts/generate-model-gateway-test-fixtures.mjs
      - run: docker compose --profile images build executor-image agent-image api runner model-gateway network-guard-image
      - name: Verify non-root Go API binaries
        run: |
          user=$(docker inspect cloud-harness-api:local --format '{{.Config.User}}')
          test "$user" = "nonroot:nonroot" -o "$user" = "nonroot" -o "$user" = "65532:65532"
          docker run --rm --entrypoint /cloud-harness-mcp cloud-harness-api:local --version
          docker run --rm --entrypoint /ingress-proxy cloud-harness-api:local --help >/dev/null
          docker run --rm --entrypoint /provisioning-proxy cloud-harness-api:local --help >/dev/null
      - run: CLOUD_HARNESS_REQUIRE_DOCKER_TESTS=1 npm run test:docker
      - run: CLOUD_HARNESS_REQUIRE_DOCKER_TESTS=1 npm run test:e2e
      - name: Assert managed-container cleanup
        if: always()
        run: |
          docker ps -a --filter label=cloud-harness.managed=true --format '{{.Names}}' | tee /tmp/cloud-harness-containers.txt
          test ! -s /tmp/cloud-harness-containers.txt
